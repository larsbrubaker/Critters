<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14281c" />
    <title>Critter Stack</title>
    <style>
      /* Bootstrap-only styling. All visible UI is painted by agg-gui into
         the canvas — per the agg-gui-only architecture rule in CLAUDE.md.
         The HTML/CSS here only owns the canvas placement. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #14281c;
        color: #ffffff;
        font-family:
          "Trebuchet MS",
          "Segoe UI",
          system-ui,
          sans-serif;
        overflow: hidden;
        height: 100%;
        height: 100dvh;
        width: 100%;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        height: 100dvh;
      }
      #critters-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="critters-canvas" width="560" height="900"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
